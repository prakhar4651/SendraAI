[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sendra-ai"
version = "0.1.0"
description = "SendraAI: Multi-Agent Autonomous Code Review & PR Risk Guardrail"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-groq>=0.1.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.0.0",
    "certifi>=2024.0.0",
]

[project.scripts]
sendra = "src.cli:main"
sendra-ai = "src.cli:main"
code-review = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "evals*", "examples*", "code_review*"]

